        <p>TwoStepsAhead · 투스텝스어헤드</p>
        <h1>데이터 기반으로 AI 콘텐츠를 만들고, AI가 좋아하는 광고를 만듭니다.</h1>
        <p>사람의 관심과 AI의 선택을 함께 설계합니다.</p>
        <p>고객이 무엇을 묻는지, AI가 어떤 출처를 참고하는지 분석합니다. 그 근거로 콘텐츠를 기획·제작하고, 브랜드가 발견되는 경로를 설계합니다. 발행 이후의 반응과 AI 노출을 다음 실행에 반영합니다.</p>
        <p>‘AI가 좋아하는 광고’는 사람에게 유용하고 AI가 브랜드를 이해하고 인용하기 쉬운 콘텐츠를 설계한다는 뜻입니다.</p>
        <p><a href="/TwoStepsAhead-Company.pdf">회사소개서 PDF</a> · <a href="mailto:glenn.kim@twostepsahead.co.kr">프로젝트 문의</a></p>
        <h2>세 가지 실행 영역</h2>
        <h3>AI 콘텐츠</h3>
        <p>드라마와 숏폼, AI 모델과 캐릭터를 직접 제작하고 운영합니다. 자체 제작 경험을 바탕으로 기업 브랜드 영상과 AI 모델 콘텐츠로 확장하며, 기업 대상 제작 범위와 일정은 프로젝트별로 협의합니다.</p>
        <h3>AI 검색·브랜드 콘텐츠</h3>
        <p>Plurank로 AI의 답변, 브랜드 언급과 인용 출처를 관측합니다. AEO/GEO 콘텐츠를 기획·발행하고, 다시 측정한 결과를 다음 콘텐츠에 반영합니다.</p>
        <h3>글로벌 커뮤니티 마케팅</h3>
        <p>MICROWAVE를 통해 해외 고객의 질문과 현지 맥락에 맞춘 Reddit 콘텐츠·운영을 진행합니다. 각 커뮤니티의 규칙과 필요한 광고 관계 공개를 적용합니다.</p>
        <h2>데이터에서 실제 작업까지</h2>
        <ul>
          <li><strong>Plurank:</strong> 14개국·7개 AI 플랫폼의 답변과 인용 출처 관측. 규모는 2026년 9월 자체 운영자료 기준입니다.</li>
          <li><strong>AI 검색 데이터 공급·분석:</strong> 어센트AI 협업을 통한 삼성 Galaxy S26 글로벌 출시 관련 프로젝트, 에이전시 고객의 AI 가시성 모니터링. 수행 범위는 2026년 10월 회사 확인자료 기준입니다.</li>
          <li><a href="https://nextep.ai.kr/"><strong>NextEp 다음화:</strong></a> 자체 AI 드라마를 제작하고 작품·회차별로 공개하는 플랫폼입니다.</li>
          <li><a href="https://rin-beauty-book.vercel.app/"><strong>RIN:</strong></a> 외모·말투·일상을 함께 설계한 AI 가상 뷰티 캐릭터입니다. 메이크업, 패션과 일상 비주얼의 제작 사례를 보여줍니다.</li>
          <li><a href="https://telling.ai.kr/"><strong>Telling:</strong></a> AI 캐릭터 대화와 개인화 콘텐츠를 제공합니다.</li>
          <li><a href="https://reddit.microwave.ai.kr/"><strong>MICROWAVE:</strong></a> 데이터 분석을 콘텐츠 주제 선정과 Reddit 운영으로 연결합니다.</li>
        </ul>
        <p>Pluora는 관측 데이터를 활용해 콘텐츠의 인용 패턴을 학습·개발하는 연구 단계입니다.</p>

        <p>최근 올리브영, MangoBoost(망고부스트)와 협업을 시작했습니다. 기존 협업 이력에는 삼성 Galaxy S26 관련 어센트AI 협업, 아워마케팅·셀라벤토의 AI 가시성 모니터링이 있습니다. 2026.10 회사 제공 자료 기준입니다.</p>
        <p>자체 YouTube 채널: <a href="https://www.youtube.com/@isthisreal_drama/videos">이게 진짜라고?</a> · <a href="https://www.youtube.com/@korehonto_drama/videos">これ 本当</a> · <a href="https://www.youtube.com/@orbit.minute/videos">ORBIT MINUTE</a></p>
